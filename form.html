<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Lengkap</title>
    <style>
        /* CSS untuk styling dasar */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse; /* Menghilangkan spasi antar sel */
        }
        td {
            padding: 10px 5px;
        }
        td:first-child {
            width: 150px; /* Lebar kolom label */
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Agar padding tidak menambah lebar */
        }
        textarea {
            resize: vertical; /* User bisa resize tinggi textarea */
            height: 80px;
        }
        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Formulir Pendaftaran Anggota</h2>
        <form action="proses.php" method="post">
            <table>
                <tr>
                    <td><label for="nama">Nama Lengkap:</label></td>
                    <td><input type="text" id="nama" name="nama_lengkap" required></td>
                </tr>
                <tr>
                    <td><label for="email">Alamat Email:</label></td>
                    <td><input type="email" id="email" name="alamat_email" required></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin:</td>
                    <td class="radio-group">
                        <input type="radio" id="pria" name="jenis_kelamin" value="Pria" required>
                        <label for="pria">Pria</label>
                        <input type="radio" id="wanita" name="jenis_kelamin" value="Wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td>Minat:</td>
                    <td class="checkbox-group">
                        <input type="checkbox" id="olahraga" name="minat[]" value="Olahraga">
                        <label for="olahraga">Olahraga</label><br>
                        <input type="checkbox" id="musik" name="minat[]" value="Musik">
                        <label for="musik">Musik</label><br>
                        <input type="checkbox" id="teknologi" name="minat[]" value="Teknologi">
                        <label for="teknologi">Teknologi</label><br>
                        <input type="checkbox" id="seni" name="minat[]" value="Seni">
                        <label for="seni">Seni</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="alamat">Alamat:</label></td>
                    <td><textarea id="alamat" name="alamat" required></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="Daftar Sekarang"></td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
